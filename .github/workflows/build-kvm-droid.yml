name: Build/test kvm-droid

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Ubuntu 24.04 restricts unprivileged user namespaces, so Chromium needs its SUID sandbox helper.
      - name: Configure Electron sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Electron smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Electron smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run smoke
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: kvm-droid-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
